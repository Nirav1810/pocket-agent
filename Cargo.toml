[workspace]
resolver = "3"
members = ["crates/protocol", "crates/agent-core", "crates/relay", "xtask"]
default-members = ["crates/protocol", "crates/agent-core", "crates/relay", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The Pocket Agent Contributors"]

[workspace.dependencies]
pocket-agent-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
subtle = "2.6.1"
base64 = "0.23.1"
hex = "0.4.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

# Size-first release profile: shared by the Android .so and the relay WASM.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-bindgen needs the `target_features` section; worker-build runs wasm-opt
# (which strips) afterwards.
[profile.release.package.pocket-agent-relay]
strip = false

# UniFFI generates bindings from metadata symbols in the compiled library, so
# agent-core is not stripped at link time. The Android Gradle plugin strips
# native libraries when packaging the APK.
[profile.release.package.pocket-agent-core]
strip = false

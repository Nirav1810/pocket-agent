name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste API keys, device tokens, pairing codes or relay URLs you want to keep private.**
        Security problems: use Security → Report a vulnerability instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (include the exact spoken command if relevant)
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Android app, Screen agent, Relay, xtask / setup, Docs, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection mode
      options: [Relay, Direct, Not applicable]
  - type: input
    id: device
    attributes:
      label: Phone model and manufacturer (OEM)
      placeholder: e.g. Xiaomi Redmi Note 13, Samsung Galaxy S24
  - type: input
    id: android
    attributes:
      label: Android version / OEM skin
      placeholder: e.g. Android 15, HyperOS 2
  - type: input
    id: version
    attributes:
      label: Pocket Agent app version and relay version (/healthz)
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact anything private)
      render: text
